#####################################################################
#  Bondtech INDX Smart Head (indxmcu): extruder, induction heater, part
#  cooling, LEDs, accelerometer, extrusion encoder, load cell.
#  From Bondtech's README (Firmware Configuration, Klipper). Values marked
#  "do not change" are Bondtech's. Mainline Klipper: the [indx] module and
#  the INDX MCU firmware come from Bondtech's indx_klipper (README.md).
#
#  The Smart Head replaces the stock toolhead board (extra_mcu): stock
#  extruder, hotend heater and thermistor, hotend fan, both part fans,
#  the toolhead accelerometer and the X endstop all move to it.
#####################################################################

[indx]
mcu: indxmcu
# Induction heater control parameters: leave at these values
pid_kp: 1.0
pid_ti: 0.0
pid_td: 0.0
pid_b: 1.0

[extruder]
# IR temperature sensor on the induction board
sensor_type: indx
min_temp: 0
max_temp: 350
smooth_time: 0.3
heater_pin: indx:heater
# Induction heating is watermark (bang-bang). Do not change to pid.
control: watermark
# Passive Tool Steel CHT 0.60 in all five docks
nozzle_diameter: 0.6
filament_diameter: 1.75
step_pin: indxmcu:motor_step
# If filament feeds backwards: !indxmcu:motor_dir
dir_pin: indxmcu:motor_dir
enable_pin: !indxmcu:motor_enable
microsteps: 32
# Pre-calibrated for the DX extruder and used by the tool-change moves: do not change
rotation_distance: 5.7
max_extrude_only_distance: 150

[tmc2240 extruder]
cs_pin: indxmcu:motor_cs
spi_software_sclk_pin: indxmcu:motor_sclk
spi_software_mosi_pin: indxmcu:motor_mosi
spi_software_miso_pin: indxmcu:motor_miso
# TMC2240 reference resistor on the INDX PCB: do not change
rref: 24000
run_current: 0.6

[fan]
# INDX Radial Part Cooling on the Smart Head (replaces stock fan0/fan1)
pin: indxmcu:part_cooling
tachometer_pin: indxmcu:part_cooling_tacho

[neopixel indx]
pin: indxmcu:led
# Fixed for the Smart Head LED array: do not change
chain_count: 16

# Bondtech's sample puts a [gcode_button endstop] on ^indxmcu:endstop.
# On the C3 that port carries the X endstop (c3_kraken.cfg, stepper_x),
# so the button section is left out: a pin can only be used once.

[lis2dw]
# Accelerometer on the INDX PCB (replaces the stock toolhead lis2dw)
i2c_mcu: indxmcu
i2c_bus: sercom3

[angle indx]
# Magnetic encoder on the extruder drive
sensor_type: as5047d
stepper: extruder
cs_pin: indxmcu:encoder_cs
spi_bus: sercom1

[load_cell_probe]
# The Smart Head load cell. It is the registered [probe] (Bondtech requires
# it): QGL and the INDX pickup/park seat checks use it. Z origin, contact
# gate and per-tool Z offsets use Beacon contact (c3_beacon.cfg, c3_macros.cfg).
sensor_type: ads131m02
cs_pin: indxmcu:loadcell_cs
spi_bus: sercom1
data_ready_pin: indxmcu:loadcell_drdy
# Mainline's ADS131M02 driver takes adc_channel (Bondtech's sample is
# Kalico's "channels") and needs the ADC clock: the INDX firmware drives
# it at 8 MHz (indx_klipper mcu/src/external_clocks.c++, FREQ_LOADCELL).
adc_channel: 0
clock_freq: 8000000
# 500 requested; at 8 MHz the nearest rate is 488.3 samples/s
sample_rate: 500
# Bondtech's starting value; tune on this machine
z_offset: -0.15
force_safety_limit: 3200
trigger_force: 150
speed: 2
lift_speed: 15
# Bondtech's retry_speed, pullback_distance and pullback_speed are
# Kalico-only; mainline Klipper refuses them, so they are left out.
samples: 3
samples_result: median
sample_retract_dist: 0.35
samples_tolerance: 0.05
samples_tolerance_retries: 3
# counts_per_gram and reference_tare_counts come from CALIBRATE_LOAD_CELL
# and are written to the SAVE_CONFIG block. Do not set them by hand.

[save_variables]
# INDX state: active tool, latch state, per-tool XY/Z offsets, mode
filename: ~/printer_data/config/indx_vars.cfg

[respond]
