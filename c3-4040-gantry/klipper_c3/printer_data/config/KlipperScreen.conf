# KlipperScreen for the iPistBit 7 inch HDMI touch display (1024 x 600, USB touch)
# in the top hat's front-right bay. The display runs on the host (Raspberry Pi
# or CB1) over HDMI + USB; it is not connected to the Kraken.
# Display bring-up on the host: README.md, "KlipperScreen display".

[main]
job_complete_timeout: 0
job_error_timeout: 0
move_speed_xy: 200
move_speed_z: 10
print_estimate_method: auto
screen_blanking: 3600
font_size: medium
theme: material-dark
side_macro_shortcut: True

[printer SV08 Max C3]
moonraker_host: 127.0.0.1
moonraker_port: 7125
z_babystep_values: 0.01, 0.05, 0.1
move_speed_xy: 200
move_speed_z: 10
calibrate_x_position: 252.5
calibrate_y_position: 252.5

# Preheat sets the bed and chamber only: INDX tools have no heater of their
# own and the induction coil heats only a tool on the head.
[preheat PLA]
bed: 60
heater_generic chamber_temp: 0

[preheat PETG]
bed: 80
heater_generic chamber_temp: 0

[preheat ABS / ASA]
bed: 100
heater_generic chamber_temp: 50

[preheat PC / PA]
bed: 100
heater_generic chamber_temp: 55

# ---------------------------------------------------------------- INDX tools menu
[menu __main more indx]
name: INDX tools
icon: extruder

[menu __main more indx t0]
name: T0 (dock 1, right)
icon: extruder
method: printer.gcode.script
params: {"script":"T0"}

[menu __main more indx t1]
name: T1 (dock 2)
icon: extruder
method: printer.gcode.script
params: {"script":"T1"}

[menu __main more indx t2]
name: T2 (dock 3, centre)
icon: extruder
method: printer.gcode.script
params: {"script":"T2"}

[menu __main more indx t3]
name: T3 (dock 4)
icon: extruder
method: printer.gcode.script
params: {"script":"T3"}

[menu __main more indx t4]
name: T4 (dock 5, left)
icon: extruder
method: printer.gcode.script
params: {"script":"T4"}

[menu __main more indx park]
name: Park tool
icon: home
method: printer.gcode.script
params: {"script":"PARK_TOOL"}

[menu __main more indx status]
name: Tool status
icon: info
method: printer.gcode.script
params: {"script":"TOOL_STATUS"}

[menu __main more indx wipe]
name: Wipe nozzle
icon: custom-script
method: printer.gcode.script
params: {"script":"C3_WIPE"}

# ---------------------------------------------------------------- chamber and light
[menu __main more c3]
name: Chamber
icon: heat-up

[menu __main more c3 light]
name: Light on/off
icon: light
method: printer.gcode.script
params: {"script":"LIGHTS_TOGGLE"}

[menu __main more c3 chamber45]
name: Chamber 45 C
icon: heat-up
method: printer.gcode.script
params: {"script":"M141 S45"}

[menu __main more c3 chamber55]
name: Chamber 55 C (max)
icon: heat-up
method: printer.gcode.script
params: {"script":"M141 S55"}

[menu __main more c3 chamberoff]
name: Chamber off
icon: cool-down
method: printer.gcode.script
params: {"script":"M141 S0"}

[menu __main more c3 exhaust]
name: Exhaust 5 min
icon: fan
method: printer.gcode.script
params: {"script":"_C3_EXHAUST_PURGE MINUTES=5"}
