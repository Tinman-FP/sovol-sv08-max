#####################################################################
#  BTT Kraken: motion, bed, fans, light, board sensors
#
#  Power: HV MOTOR input (all eight TMC2160) from the motor PSU set to 48 V,
#  DCIN 24 V (logic, HE0-HE3, fans), BED IN 24 V (only drives the bed
#  SSR's control input). See PIN_ASSIGNMENTS.md for every wire.
#
#  Board: Kraken V1.1 (owner's purchase, 2026-10-30): S1-S4 sense
#  resistor 0.050 (4.7 A drivers), S5-S8 0.075 (3 A). A V1.0 board
#  would need 0.022 on S1-S4.
#
#  X and Y home sensorless (TMC2160 StallGuard on the DIAG1 lines):
#  DIAG jumpers ON for S1 (stepper_x) and S3 (stepper_y), all others OFF.
#  Mainline Klipper: one touch (homing_retract_dist 0); c3_homing.cfg backs
#  off and pauses between axes. Homing runs at run_current, because INDX's
#  INDX_DOCK_MEASURE homes through Klipper directly at run current and one
#  driver_SGT value has to suit both. Tune driver_SGT on the machine.
#  Fan voltage jumpers: 24 V for FAN0-FAN5.
#####################################################################

# ------------------------------------------------------------------ X / Y (AWD)
# Klipper corexy: stepper_x and stepper_x1 drive one belt, stepper_y and
# stepper_y1 the other. Motor names are the C3 CAD's: lower belt A (rear
# left) + A2 (front left), upper belt B (rear right) + B2 (front right).
# The dir_pin polarities are a starting guess: check every motor with the
# AWD procedure in README.md before the belts carry load.

[stepper_x]
# S1: motor A, rear left. LDO 42STH48-2004MAH, 0.9 deg, 2.0 A
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
# Sensorless, homing to X min (the left end). Hard stop from the C3 CAD:
# the X carriage meets the left XY joint's pulley carrier 1.0-1.25 mm past
# the design travel (CAD X +253.1 = Klipper -5.6), on a ~120 mm2 printed
# face, just before the X block reaches the rail end (+1.3 mm). The Smart
# Head PCB cover is ~0.75 mm further. Measure the real stop at bring-up.
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: -5.6
position_min: -5.6
position_max: 499.5
homing_speed: 40
homing_retract_dist: 0

[tmc5160 stepper_x]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
# S1 DIAG1 (DIAG jumper on S1). Active low.
diag1_pin: ^!PC15
# StallGuard2 threshold: -64 most sensitive, 63 least. Starting value;
# tune per README (Klipper TMC_Drivers.md, sensorless homing).
driver_SGT: 1
run_current: 1.4
# Kraken V1.1
sense_resistor: 0.050
interpolate: false
stealthchop_threshold: 0

[stepper_x1]
# S2: motor A2, front left (same belt as stepper_x)
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40

[tmc5160 stepper_x1]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.050
interpolate: false
stealthchop_threshold: 0

[stepper_y]
# S3: motor B, rear right. LDO 42STH48-2004MAH, 0.9 deg, 2.0 A
step_pin: PE2
dir_pin: PE1
enable_pin: !PE0
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
# Sensorless, homing to the rear (Y max): the docks are at the front, so
# Y must home away from them, and X then homes at the rear, clear of the
# tools. Hard stop from the C3 CAD (2026-10-30 sweep): without stop pads
# the XY joint plates meet the rear-corner motor plates 1.75 mm past the
# design travel and the X beam reaches the motor cans 0.25 mm later.
# The C3 rear-corner motor mounts now carry 1.25 mm stop pads
# (c3_build.rear_corner, Y_STOP_PAD): contact 0.5 mm past travel, Klipper
# Y 502.1. Do not home Y sensorless on mounts printed without them.
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 502.1
position_min: -5.0
position_max: 502.1
homing_speed: 30
homing_retract_dist: 0

[tmc5160 stepper_y]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
# S3 DIAG1 (DIAG jumper on S3). Active low.
diag1_pin: ^!PF1
driver_SGT: 1
run_current: 1.4
sense_resistor: 0.050
interpolate: false
stealthchop_threshold: 0

[stepper_y1]
# S4: motor B2, front right (same belt as stepper_y)
step_pin: PB9
dir_pin: PB8
enable_pin: !PB7
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40

[tmc5160 stepper_y1]
cs_pin: PD3
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.4
sense_resistor: 0.050
interpolate: false
stealthchop_threshold: 0

# ------------------------------------------------------------------ Z (4 x 17HM19-2004S1)
# Sovol's drive: 12T motor pulley, ~80T reduction, 20T belt pulley.
# rotation_distance and gear_ratio are Sovol's; full steps 400 for the
# 0.9 deg motors. Corner order is Klipper's QGL order: front left, rear
# left, rear right, front right (as stock). dir_pin follows stock's
# alternating pattern; check each corner (README.md).

[stepper_z]
# S5: front left
step_pin: PG9
dir_pin: PG10
enable_pin: !PG13
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
gear_ratio: 80:12
# The INDX load cell is the registered probe. G28 Z runs through the INDX
# homing macro, which uses Beacon contact by default (c3_beacon.cfg) and
# this endstop when _C3_VARS z_home_method is "load_cell".
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 495
homing_speed: 2.0
second_homing_speed: 1.0
homing_retract_dist: 2.0
homing_retract_speed: 10

[tmc5160 stepper_z]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.2
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 0

[stepper_z1]
# S6: rear left
step_pin: PG11
dir_pin: !PD7
enable_pin: !PG12
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
gear_ratio: 80:12

[tmc5160 stepper_z1]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.2
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 0

[stepper_z2]
# S7: rear right
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
gear_ratio: 80:12

[tmc5160 stepper_z2]
cs_pin: PA9
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.2
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 0

[stepper_z3]
# S8: front right
step_pin: PG15
dir_pin: !PB6
enable_pin: !PG14
microsteps: 16
full_steps_per_rotation: 400
rotation_distance: 40
gear_ratio: 80:12

[tmc5160 stepper_z3]
cs_pin: PA10
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
run_current: 1.2
sense_resistor: 0.075
interpolate: true
stealthchop_threshold: 0

# ------------------------------------------------------------------ bed (Sovol mains bed through its SSR)
[thermistor bed_thermistor]
# Sovol's stock table
temperature1: 25
resistance1: 100000
temperature2: 50
resistance2: 18085.4
temperature3: 100
resistance3: 5362.6

[heater_bed]
# Kraken HB drives the bed SSR's DC control input (stock: main board PD12)
heater_pin: PF5
sensor_type: bed_thermistor
# Kraken TB (stock: PC5)
sensor_pin: PB0
max_power: 1.0
min_temp: 0
max_temp: 110
control: pid
# Stock PID; run PID_CALIBRATE HEATER=heater_bed TARGET=100 after the move
pid_kp: 73.571
pid_ki: 1.820
pid_kd: 783.849

[verify_heater heater_bed]
max_error: 120
check_gain_time: 90
hysteresis: 10
heating_gain: 1

[heater_fan bed_fan]
# Stock bed_fan (PE14, tach PB10). Power on FAN2; the tach wire goes to
# the TACH pin of the FAN6 4-pin header (FAN6 itself stays unused).
pin: PA2
max_power: 1.0
kick_start_time: 0.5
heater: heater_bed
heater_temp: 35
tachometer_pin: ^PC1
tachometer_ppr: 2
tachometer_poll_interval: 0.001375

# ------------------------------------------------------------------ chamber fans (control loop in c3_chamber.cfg)
[fan_generic chamber_circulation]
# Stock fan2 (main board PB0), the internal circulation fan. FAN0, 24 V.
pin: PA0
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10

[fan_generic exhaust_fan]
# Stock fan3 (main board PE11). FAN1, 24 V.
pin: PA1
max_power: 1.0
kick_start_time: 0.5
off_below: 0.10

[controller_fan kraken_fan]
# New: cooling for the eight 60 V TMC2160 stages. FAN3, 24 V, aimed at
# the driver row and the HV input.
pin: PA3
max_power: 1.0
kick_start_time: 0.5
idle_timeout: 120
heater: heater_bed

# ------------------------------------------------------------------ light
[output_pin chamber_light]
# Sovol LED bar (stock: main board PD13). HE1 gives it 6 A of headroom.
pin: PF7
pwm: True
cycle_time: 0.010
value: 1
shutdown_value: 0

# ------------------------------------------------------------------ board sensors
[temperature_sensor kraken]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor host]
sensor_type: temperature_host
min_temp: 0
max_temp: 110
