#####################################################################
#  Beacon Rev H (USB), bed mesh, quad gantry level, and the Z home source.
#
#  Roles on the C3:
#    Beacon proximity: bed mesh (rapid scan) and the adaptive heat soak.
#    Beacon contact:   Z origin at G28 Z (default; see _C3_VARS).
#    INDX load cell:   registered [probe]: QGL, CAL_Z per-tool offsets,
#                      pickup/park seat checks, START_PRINT contact gate.
#  Bondtech: with the load cell present, Beacon must not register as the
#  probe and its probe commands get a BEACON_ prefix (BEACON_PROBE,
#  BEACON_PROBE_ACCURACY, BEACON_Z_OFFSET_APPLY_PROBE).
#
#  Beacon's own G28 helper (home_xy_position, home_method) cannot be used:
#  Klipper allows one [homing_override] and INDX needs it. Contact homing
#  therefore runs inside the INDX sequence (_INDX_HOME_Z_PROBE below),
#  after INDX has made sure T0 is the tool on the head.
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_REPLACE_ME-if00
# Coil centre relative to the nozzle, from the C3 CAD: on the nozzle's X,
# 40.25 mm behind it (CAD Y_XB + 26 vs nozzle Y_XB + 66.25). Check on the
# machine before trusting a mesh (README, commissioning).
x_offset: 0.0
y_offset: 40.25
mesh_main_direction: x
mesh_runs: 2
mesh_overscan: 5
register_as_probe: False
prefixed_probe_commands: True
# Beacon refuses contact above this nozzle temperature. START_PRINT does
# its final contact at _C3_VARS contact_temp (150 C).
contact_max_hotend_temperature: 180

[bed_mesh]
speed: 300
horizontal_move_z: 2
# Coil positions. Y starts at 70 because the coil is 40.25 mm behind the
# nozzle and the nozzle must stay at Y >= 28.5 between X 61.5 and 441.5
# (docks and wiper stations). Prints in the front strip below Y 70 use
# the nearest mesh row.
mesh_min: 15, 70
mesh_max: 490, 495
probe_count: 45, 45
algorithm: bicubic
bicubic_tension: 0.2
# G28 Z touches at the bed centre (TOOL_POSITIONS probe_x/probe_y)
zero_reference_position: 252.5, 252.5
adaptive_margin: 5
fade_start: 1
fade_end: 10

[quad_gantry_level]
# Probed with the INDX load cell (nozzle contact, no probe offset).
# Z belt attachment points from the C3 CAD (Z belts at CAD Y -57.5 and
# 604.5, corners mirrored about the bed centre).
gantry_corners:
    -62.5, -38.5
    557.5, 623.5
# Front left, rear left, rear right, front right (stepper_z..stepper_z3).
# Y 45 keeps the head behind the front keep-out.
points:
    40, 45
    40, 460
    460, 460
    460, 45
speed: 300
horizontal_move_z: 10
retry_tolerance: 0.0075
retries: 10
max_adjust: 15

# ------------------------------------------------------------------ Z home source
# Replaces Bondtech's _INDX_HOME_Z_PROBE from indx/homing.cfg (this file is
# included after it, so this definition wins). The only change is the
# G28 Z line: Beacon contact or the load cell, chosen by
# _C3_VARS z_home_method. Everything before (seat checks, T0 fetch) and
# after (lift, z_home_tool, homing_busy) is Bondtech's sequence.
[gcode_macro _INDX_HOME_Z_PROBE]
description: Inner - move to probe XY and home Z (C3: Beacon contact, or the load cell)
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set th = printer.toolhead %}
    {% set px = tp.probe_x|float %}
    {% set py = tp.probe_y|float %}
    {% if px < 0 %}
        {% set px = (th.axis_minimum.x + th.axis_maximum.x) / 2 %}
    {% endif %}
    {% if py < 0 %}
        {% set py = (th.axis_minimum.y + th.axis_maximum.y) / 2 %}
    {% endif %}
    {% set nozzle = printer.extruder.temperature|float %}
    {% set limit = printer.configfile.settings.beacon.contact_max_hotend_temperature|default(180)|float %}

    G90
    G0 X{"%.3f"|format(px)} Y{"%.3f"|format(py)} F{tp.home_travel_feedrate|default(3000)|int}
    {% if cv.z_home_method == "beacon_contact" and nozzle < limit - 5 %}
        _C3_BEACON_CONTACT_HOME
    {% else %}
        {% if cv.z_home_method == "beacon_contact" %}
            RESPOND TYPE=echo MSG="C3: nozzle at {nozzle|round(1)} C is too hot for Beacon contact (limit {limit|round(0)} C); homing Z on the INDX load cell"
        {% endif %}
        G28 Z
    {% endif %}
    G0 Z{"%.3f"|format(tp.probe_z_clearance|float)} F{tp.home_z_feedrate|default(900)|int}
    SET_GCODE_VARIABLE MACRO=_INDX_HOME_Z VARIABLE=z_faked VALUE=0
    {% set act = printer.save_variables.variables.active_tool|default(-1)|int %}
    SAVE_VARIABLE VARIABLE=z_home_tool VALUE={act}
    SET_GCODE_VARIABLE MACRO=_TOOLCHANGE_VARS VARIABLE=homing_busy VALUE=0
    _INDX_LCD_CLEAR

[gcode_macro _C3_BEACON_CONTACT_HOME]
description: Inner - home Z by Beacon contact at the current XY, and refresh the proximity model as _C3_VARS beacon_autocal says
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set unhomed = printer["gcode_macro _INDX_HOME_Z"].z_faked|int == 1 %}
    {% set has_model = printer.beacon.model is not none %}
    {% if cv.beacon_autocal == "always" or not has_model %}
        {% set skip = 0 %}
    {% elif cv.beacon_autocal == "unhomed" and unhomed %}
        {% set skip = 0 %}
    {% else %}
        {% set skip = 1 %}
    {% endif %}
    BEACON_AUTO_CALIBRATE SKIP_MODEL_CREATION={skip}
    _C3_BEACON_CONTACT_CHECK

[gcode_macro _C3_BEACON_CONTACT_CHECK]
description: Inner - fail closed unless the Beacon contact home reported ok
gcode:
    {% if printer.beacon.last_probe_result != "ok" %}
        {action_raise_error("C3: Beacon contact home did not complete (last_probe_result %s)" % printer.beacon.last_probe_result)}
    {% endif %}
