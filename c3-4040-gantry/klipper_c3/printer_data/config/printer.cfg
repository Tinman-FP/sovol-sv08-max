#####################################################################
#  SV08 Max C3: AWD 4040 gantry, Bondtech INDX (5 tools), Beacon Rev H
#  BTT Kraken main board. Firmware: mainline Klipper on every board, with
#  Bondtech's indx_klipper module for the Smart Head; see README.md.
#
#  Written 2026-10-30 from the C3 CAD and the stock SV08 Max config.
#  NOT INSTALLED. Follow klipper_c3/README.md (bring-up order) before
#  this goes on the printer. Every REPLACE_ME must be filled in.
#
#  Coordinates: Klipper X 0..505 left to right, Y 0..505 front to rear
#  (docks and wiper stations at the front), Z up. Klipper X = 247.5 - CAD X,
#  Klipper Y = 566 - CAD Y (CAD = Sovol's stock-pose model frame).
#####################################################################

[include mainsail.cfg]
[include c3_kraken.cfg]
[include c3_chamber.cfg]
[include c3_indx.cfg]
[include indx/indx.cfg]
[include indx/indx-tc-macros.cfg]
[include indx/indx-cal.cfg]
[include indx/homing.cfg]
# After indx/homing.cfg: c3_homing.cfg wraps Bondtech's G28 X / G28 Y for
# sensorless homing, and c3_beacon.cfg replaces _INDX_HOME_Z_PROBE so G28 Z
# homes with Beacon contact.
[include c3_homing.cfg]
[include c3_beacon.cfg]
[include c3_macros.cfg]

[mcu]
# BTT Kraken V1.1, STM32H723, flashed as a USB-to-CAN bridge (USB on
# PA11/PA12, CAN on PD0/PD1, 1000000 bit/s), like the stock SV08 main board.
# Its CAN port carries Sovol's chamber heater controller (c3_chamber.cfg).
# Find the UUID with: ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
canbus_uuid: REPLACE_ME

[mcu indxmcu]
# Bondtech INDX Smart Head through the Link Board (switches on USB)
serial: /dev/serial/by-id/usb-Bondtech_INDX_REPLACE_ME

[printer]
kinematics: corexy
# Start values. Raise only after input shaping and an AWD current check.
# INDX tool changes run at 70 % (MODE_NORMAL) or 100 % (MODE_SPORT) of these.
max_velocity: 500
max_accel: 20000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0
max_z_velocity: 10
max_z_accel: 300

[input_shaper]
# Empty until SHAPER_CALIBRATE has run (accelerometer on the INDX head)

[resonance_tester]
accel_chip: lis2dw
probe_points:
    252.5, 252.5, 20

[exclude_object]

[gcode_arcs]
resolution: 1.0

[force_move]
# For the AWD direction checks in README.md. Set False after bring-up.
enable_force_move: True

[idle_timeout]
timeout: 1800
gcode: _C3_IDLE_TIMEOUT

# SAVE_CONFIG appends its block below this line (PID, load cell, shaper, Beacon model).
