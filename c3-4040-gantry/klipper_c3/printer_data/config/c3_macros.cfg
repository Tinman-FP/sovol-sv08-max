#####################################################################
#  C3 print macros: settings, START_PRINT / END_PRINT, the adaptive heat
#  soak and gates carried over from the stock machine, wiper-station
#  purge and wipe, filament load at the station, fans, light.
#####################################################################

[gcode_macro _C3_VARS]
description: C3 settings. Edit here.
# --- Z home source for G28 Z: "beacon_contact" or "load_cell"
variable_z_home_method: "beacon_contact"
# --- Beacon proximity model refresh at a contact home: "always", "unhomed", "never"
variable_beacon_autocal: "always"
# --- Nozzle temperature (T0) for the final contact home in START_PRINT; 0 = cold
variable_contact_temp: 150
# --- Wiper stations (C3 CAD, c3_purge.py). Machine coordinates of the nozzle.
#     Station centres at CAD X +150 / -160; purge at CAD Y 571, wipe back to 548.7
#     (3.5 mm past the 15 mm Qidi Plus 4 pad).
variable_station_x: [97.5, 407.5]
variable_station_purge_y: -5.0
variable_station_wipe_y: 17.3
# Travel in X only at this Y or further back (behind every keep-out)
variable_station_approach_y: 33.0
# Wipe strokes stay within +-8 mm of the station centre (checked in CAD)
variable_station_side: 8.0
# Below this Z the station sliders rest on the PEI and are lifted: no wipes
variable_station_min_z: 12.0
# Purges (print start, filament load) happen at this Z or higher
variable_purge_z: 30.0
variable_wipe_strokes: 3
variable_wipe_feed: 4800
variable_travel_feed: 18000
variable_purge_length: 25.0
variable_purge_feed: 300
variable_purge_dwell: 3.0
# --- Nozzle limit: Bondtech rates the Smart Head and the CHT tools to 300 C
#     (indx_klipper's [indx] shuts down above 305 C). PPS needs more than this.
variable_max_nozzle_temp: 300
# --- Bed limit: Sovol rates the SV08 Max bed to 100 C ([heater_bed] shuts down at 110)
variable_max_bed_temp: 100
# --- Chamber target by filament type, used when the slicer sends no CHAMBER>0.
#     Capped by _C3_CHAMBER_STATE max_target (55 C: the Smart Head is rated
#     for 60 C ambient). CHT tools are for non-abrasive filament only, so no
#     CF/GF entries here.
variable_chamber_by_filament: {"PLA": 0, "PETG": 0, "TPU": 0, "PCTG": 45, "ABS": 50, "ASA": 50, "PC": 55, "PA": 55, "PP": 40}
# --- Chamber ceiling for unheated filaments (exhaust runs above it); 0 = none
variable_chamber_cap_by_filament: {"PLA": 35, "PETG": 45, "TPU": 40}
# --- Adaptive heat soak, the stock machine's contract (2026-10-15)
variable_heat_soak: 1
variable_heat_soak_threshold: 0.010
variable_heat_soak_interval: 60
variable_heat_soak_settle: 60
variable_heat_soak_max_passes: 35
# --- Contact gate (Beacon contact) after the soak
variable_contact_gate_tolerance: 0.030
variable_contact_gate_median_tolerance: 0.025
# --- End of print
variable_park_tool_at_end: True
variable_park_x: 252.5
variable_park_y: 470.0
variable_exhaust_after_minutes: 5
gcode:

# ------------------------------------------------------------------ print start
[gcode_macro START_PRINT]
description: C3 print start. BED= TOOL= TEMP= [FILAMENT=] [CHAMBER=] [HEAT_SOAK=0|1] [MESH=adaptive|full]
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set cs = printer["gcode_macro _C3_CHAMBER_STATE"] %}
    {% set bed = params.BED|default(0)|float %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set temp = params.TEMP|default(0)|float %}
    {% set fil = params.FILAMENT|default("")|string|upper %}
    {% set chamber_param = params.CHAMBER|default(0)|float %}
    {% set chamber = chamber_param if chamber_param > 0 else cv.chamber_by_filament.get(fil, 0)|float %}
    {% set chamber = [chamber, cs.max_target|float]|min %}
    {% set cap = 0.0 if chamber > 0 else cv.chamber_cap_by_filament.get(fil, 0)|float %}
    {% set mesh = params.MESH|default("adaptive")|string|lower %}
    {% set soak = params.HEAT_SOAK|default(cv.heat_soak)|int == 1 and chamber > 0 and bed > 0 %}

    {% if bed < 0 or bed > cv.max_bed_temp|float %}
        { action_raise_error("START_PRINT: BED=%.0f is outside 0..%.0f C" % (bed, cv.max_bed_temp|float)) }
    {% endif %}
    {% if tool < 0 or tool >= tp.tool_count|int %}
        { action_raise_error("START_PRINT: TOOL=%d is not configured (T0-T%d)" % (tool, tp.tool_count|int - 1)) }
    {% endif %}
    {% if temp <= 0 or temp > cv.max_nozzle_temp|float %}
        { action_raise_error("START_PRINT: TEMP=%.0f is missing or above the INDX limit of %.0f C" % (temp, cv.max_nozzle_temp|float)) }
    {% endif %}
    {% if mesh not in ["adaptive", "full"] %}
        { action_raise_error("START_PRINT: MESH must be adaptive or full") }
    {% endif %}

    RESPOND TYPE=echo MSG="C3 start: bed {bed|round(0)} C, T{tool} {temp|round(0)} C, filament {fil if fil else 'unknown'}, chamber {chamber|round(0)} C{(' (ceiling %.0f C)' % cap) if cap > 0 else ''}, heat soak {'on' if soak else 'off'}, {mesh} mesh"
    CLEAR_PAUSE
    BED_MESH_CLEAR
    M107
    LIGHTS_ON
    SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cap VALUE={cap}

    # 1. Bed first (electrical boundary from the stock machine: the chamber
    #    heater never starts before the bed is at target)
    M140 S{bed}
    G28
    M190 S{bed}

    # 2. Chamber
    {% if chamber > 0 %}
        M191 S{chamber}
    {% else %}
        M141 S0
    {% endif %}

    # 3. Level, soak until the bed stops moving, level again
    QUAD_GANTRY_LEVEL
    {% if soak %}
        _C3_ADAPTIVE_HEAT_SOAK ADAPTIVE={1 if mesh == "adaptive" else 0}
        QUAD_GANTRY_LEVEL
    {% endif %}

    # 4. Contact gate, final Z origin, final mesh
    _C3_CONTACT_GATE
    _C3_FINAL_Z_HOME
    {% if mesh == "adaptive" %}
        BED_MESH_CALIBRATE ADAPTIVE=1
    {% else %}
        BED_MESH_CALIBRATE
    {% endif %}
    _C3_FINAL_GEOMETRY_GATE

    # 5. First tool: INDX heats only after the pickup
    CHANGE_TOOL TOOL={tool} TEMP={temp}
    M109 S{temp}
    C3_PURGE
    G92 E0
    RESPOND TYPE=echo MSG="C3 start complete"

[gcode_macro PRINT_START]
description: Alias for START_PRINT
gcode:
    START_PRINT {rawparams}

# ------------------------------------------------------------------ adaptive heat soak (Beacon mesh passes)
[gcode_macro _C3_ADAPTIVE_HEAT_SOAK]
description: Repeat Beacon mesh passes until two in a row agree within THRESHOLD mm; fail closed at the pass limit
variable_last_mesh: []
variable_last_delta: 999.0
variable_iteration: 0
variable_stable: 0
variable_threshold: 0.010
variable_interval_seconds: 60
variable_max_iterations: 35
variable_adaptive: 1
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set threshold = params.THRESHOLD|default(cv.heat_soak_threshold)|float %}
    {% set interval = params.INTERVAL|default(cv.heat_soak_interval)|int %}
    {% set settle = params.SETTLE|default(cv.heat_soak_settle)|int %}
    {% set max_iterations = params.MAX_PASSES|default(cv.heat_soak_max_passes)|int %}
    {% set adaptive = params.ADAPTIVE|default(1)|int %}
    {% set chamber = printer["heater_generic chamber_temp"].target|default(0)|float %}
    {% set bed = printer.heater_bed.target|default(0)|float %}
    {% if chamber <= 0 %}
        RESPOND TYPE=echo MSG="C3 heat soak skipped: chamber target is zero"
    {% elif bed <= 0 %}
        { action_raise_error("C3 heat soak refused: bed target is zero") }
    {% elif printer.quad_gantry_level.applied|lower != 'true' %}
        { action_raise_error("C3 heat soak refused: QGL is not applied") }
    {% elif threshold <= 0 %}
        { action_raise_error("C3 heat soak refused: THRESHOLD must be positive") }
    {% elif interval < 0 or settle < 0 %}
        { action_raise_error("C3 heat soak refused: waits cannot be negative") }
    {% elif max_iterations < 2 or max_iterations > 35 %}
        { action_raise_error("C3 heat soak refused: MAX_PASSES must be 2 through 35") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=last_mesh VALUE="[]"
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=last_delta VALUE=999.0
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=iteration VALUE=0
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=stable VALUE=0
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=threshold VALUE={threshold}
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=interval_seconds VALUE={interval}
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=max_iterations VALUE={max_iterations}
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=adaptive VALUE={adaptive}
        RESPOND TYPE=echo MSG="C3 heat soak start: threshold {threshold|round(4)} mm, up to {max_iterations} passes"
        {% if settle > 0 %}
            _C3_SOAK_WAIT SECONDS={settle}
        {% endif %}
        {% for i in range(1, max_iterations + 1) %}
            _C3_SOAK_PASS ITER={i}
            _C3_SOAK_WAIT_IF_CHANGING
        {% endfor %}
        _C3_SOAK_DONE
    {% endif %}

[gcode_macro _C3_SOAK_WAIT]
description: Inner - wait SECONDS in 5 s slices, running the chamber HVAC step each slice
gcode:
    {% set seconds = params.SECONDS|default(0)|int %}
    {% if seconds < 0 %}
        { action_raise_error("C3 soak wait refused: SECONDS cannot be negative") }
    {% endif %}
    {% for _ in range(seconds // 5) %}
        _C3_HVAC_STEP
        G4 P5000
        M400
    {% endfor %}
    {% if seconds % 5 > 0 %}
        _C3_HVAC_STEP
        G4 P{(seconds % 5) * 1000}
        M400
    {% endif %}

[gcode_macro _C3_SOAK_PASS]
description: Inner - one Beacon mesh pass, unless the soak is already stable
gcode:
    {% set state = printer["gcode_macro _C3_ADAPTIVE_HEAT_SOAK"] %}
    {% set iteration = params.ITER|default(1)|int %}
    {% if state.stable|int == 0 %}
        M117 Heat soak pass {iteration}/{state.max_iterations|int}
        RESPOND TYPE=echo MSG="C3 heat soak mesh pass {iteration}/{state.max_iterations|int}"
        _C3_HVAC_STEP
        BED_MESH_CLEAR
        {% if state.adaptive|int == 1 %}
            BED_MESH_CALIBRATE ADAPTIVE=1
        {% else %}
            BED_MESH_CALIBRATE
        {% endif %}
        G90
        G0 Z10 F600
        M400
        _C3_SOAK_COMPARE ITER={iteration}
    {% endif %}

[gcode_macro _C3_SOAK_COMPARE]
description: Inner - compare the newest mesh with the previous pass, point by point
gcode:
    {% set state = printer["gcode_macro _C3_ADAPTIVE_HEAT_SOAK"] %}
    {% set iteration = params.ITER|default(1)|int %}
    {% set mesh = printer.bed_mesh.probed_matrix|default([]) %}
    {% set last = state.last_mesh|default([]) %}
    {% set ns = namespace(max_delta=0.0, comparable=1, point_count=0) %}
    {% if mesh|length == 0 %}
        { action_raise_error("C3 heat soak failed: the mesh pass returned no probed matrix") }
    {% else %}
        {% if last|length != mesh|length %}
            {% set ns.comparable = 0 %}
        {% else %}
            {% for y in range(mesh|length) %}
                {% if last[y]|length != mesh[y]|length %}
                    {% set ns.comparable = 0 %}
                {% else %}
                    {% for x in range(mesh[y]|length) %}
                        {% set ns.point_count = ns.point_count + 1 %}
                        {% set delta = (mesh[y][x]|float - last[y][x]|float)|abs %}
                        {% if delta > ns.max_delta %}
                            {% set ns.max_delta = delta %}
                        {% endif %}
                    {% endfor %}
                {% endif %}
            {% endfor %}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=last_mesh VALUE="{mesh}"
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=last_delta VALUE={ns.max_delta}
        SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=iteration VALUE={iteration}
        {% if iteration == 1 %}
            RESPOND TYPE=echo MSG="C3 heat soak baseline captured ({mesh|length} rows)"
        {% elif ns.comparable == 0 %}
            {% if iteration >= state.max_iterations|int %}
                { action_raise_error("C3 heat soak failed: meshes not comparable at the pass limit") }
            {% else %}
                RESPOND TYPE=echo MSG="C3 heat soak: mesh size changed, new baseline"
            {% endif %}
        {% elif ns.max_delta <= state.threshold|float %}
            SET_GCODE_VARIABLE MACRO=_C3_ADAPTIVE_HEAT_SOAK VARIABLE=stable VALUE=1
            RESPOND TYPE=echo MSG="C3 heat soak stable: max point change {ns.max_delta|round(4)} mm over {ns.point_count} points"
        {% elif iteration >= state.max_iterations|int %}
            { action_raise_error("C3 heat soak failed: max point change %.4f mm is above %.4f mm after %d passes" % (ns.max_delta, state.threshold|float, iteration)) }
        {% else %}
            RESPOND TYPE=echo MSG="C3 heat soak still moving: max point change {ns.max_delta|round(4)} mm"
        {% endif %}
    {% endif %}

[gcode_macro _C3_SOAK_WAIT_IF_CHANGING]
description: Inner - wait between passes only while the bed is still changing
gcode:
    {% set state = printer["gcode_macro _C3_ADAPTIVE_HEAT_SOAK"] %}
    {% if state.stable|int == 0 and state.iteration|int < state.max_iterations|int %}
        _C3_SOAK_WAIT SECONDS={state.interval_seconds|int}
    {% endif %}

[gcode_macro _C3_SOAK_DONE]
description: Inner - fail closed unless two consecutive passes agreed
gcode:
    {% set state = printer["gcode_macro _C3_ADAPTIVE_HEAT_SOAK"] %}
    {% if state.stable|int == 0 %}
        { action_raise_error("C3 heat soak failed: no stable pair of meshes") }
    {% endif %}
    RESPOND TYPE=echo MSG="C3 heat soak complete after {state.iteration|int} passes, last change {state.last_delta|float|round(4)} mm"
    M117

# ------------------------------------------------------------------ gates and final Z
[gcode_macro _C3_CONTACT_GATE]
description: Two consecutive Beacon contact median probes at the bed centre must agree
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% if printer.quad_gantry_level.applied|lower != 'true' %}
        { action_raise_error("C3 contact gate refused: QGL is not applied") }
    {% endif %}
    G90
    G0 Z5 F600
    G0 X{tp.probe_x|float} Y{tp.probe_y|float} F{cv.travel_feed}
    BEACON_PROBE PROBE_METHOD=contact SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE={cv.contact_gate_tolerance} SAMPLES_TOLERANCE_RETRIES=2
    _C3_CONTACT_GATE_SECOND

[gcode_macro _C3_CONTACT_GATE_SECOND]
description: Inner - second median probe
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set first = printer.beacon.last_z_result|float %}
    G91
    G0 Z3 F600
    G90
    BEACON_PROBE PROBE_METHOD=contact SAMPLES=3 SAMPLES_RESULT=median SAMPLES_TOLERANCE={cv.contact_gate_tolerance} SAMPLES_TOLERANCE_RETRIES=2
    _C3_CONTACT_GATE_REPORT FIRST={first}

[gcode_macro _C3_CONTACT_GATE_REPORT]
description: Inner - compare the two medians
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set first = params.FIRST|float %}
    {% set second = printer.beacon.last_z_result|float %}
    {% set delta = (first - second)|abs %}
    {% if delta > cv.contact_gate_median_tolerance|float %}
        { action_raise_error("C3 contact gate failed: medians differ by %.4f mm, limit %.4f mm" % (delta, cv.contact_gate_median_tolerance|float)) }
    {% endif %}
    G91
    G0 Z3 F600
    G90
    RESPOND TYPE=echo MSG="C3 contact gate passed: {first|round(4)} and {second|round(4)}, difference {delta|round(4)} mm"

[gcode_macro _C3_FINAL_Z_HOME]
description: Final Z origin with T0 warm and wiped (Beacon contact by default)
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set warm = cv.contact_temp|float > 0 %}
    {% if warm %}
        G90
        G0 Z{cv.station_min_z|float + 3} F600
        M109 S{cv.contact_temp}
        C3_WIPE
    {% endif %}
    G28 Z
    {% if warm %}
        M104 S0
    {% endif %}

[gcode_macro _C3_FINAL_GEOMETRY_GATE]
description: Fail closed unless XYZ is homed, QGL applied and a mesh is loaded
gcode:
    {% set ns = namespace(errors=[]) %}
    {% if printer.toolhead.homed_axes|lower != 'xyz' %}
        {% set ns.errors = ns.errors + ['XYZ not homed'] %}
    {% endif %}
    {% if printer.quad_gantry_level.applied|lower != 'true' %}
        {% set ns.errors = ns.errors + ['QGL not applied'] %}
    {% endif %}
    {% if printer.bed_mesh.probed_matrix|default([])|length == 0 %}
        {% set ns.errors = ns.errors + ['no bed mesh loaded'] %}
    {% endif %}
    {% if printer.configfile.warnings|default([])|length > 0 %}
        {% set ns.errors = ns.errors + ['configuration warnings present'] %}
    {% endif %}
    {% if ns.errors|length > 0 %}
        { action_raise_error("C3 final geometry gate failed: %s" % (ns.errors|join(', '))) }
    {% endif %}
    RESPOND TYPE=echo MSG="C3 final geometry gate passed"

# ------------------------------------------------------------------ per-tool Z offsets by Beacon contact
# Replaces INDX CAL_Z (load cell) as the source of tN_offset_z. Same storage
# and sign as Bondtech's _CZ_FINALIZE: tN_offset_z = t0_offset_z + (zN - z0),
# where zN is tool N's contact height. Nozzles must be cold and clean.
[gcode_macro C3_CAL_TOOL_Z]
description: Measure every tool's Z offset relative to T0 with Beacon contact (cold, clean nozzles). SAMPLES= X= Y=
variable_samples: 5
variable_tolerance: 0.010
variable_toolchange_z: 20.0
gcode:
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    {% set me = printer["gcode_macro C3_CAL_TOOL_Z"] %}
    {% set n = tp.tool_count|int %}
    {% set samples = params.SAMPLES|default(me.samples)|int %}
    # Default: 30 mm behind the homing point, so the tools do not all touch the same spot
    {% set px = params.X|default(tp.probe_x)|float %}
    {% set py = params.Y|float if 'Y' in params else tp.probe_y|float + 30.0 %}
    {% if printer.extruder.temperature|float > 60 %}
        { action_raise_error("C3_CAL_TOOL_Z: let the nozzle cool below 60 C first") }
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes|lower %}
        G28
    {% endif %}
    RESPOND TYPE=echo MSG="C3_CAL_TOOL_Z: {n} tools, {samples} Beacon contact samples each at X{px|round(1)} Y{py|round(1)}"
    {% for i in range(n) %}
        _C3_CAL_TOOL_Z_ONE TOOL={i} X={px} Y={py} SAMPLES={samples}
    {% endfor %}
    _C3_CAL_TOOL_Z_FINISH N={n}

[gcode_macro _C3_CAL_TOOL_Z_ONE]
description: Inner - pick up TOOL and record its Beacon contact height
gcode:
    {% set me = printer["gcode_macro C3_CAL_TOOL_Z"] %}
    {% set lift = [printer.toolhead.position.z|float, me.toolchange_z|float]|max %}
    G90
    G0 Z{"%.3f"|format(lift)} F600
    CHANGE_TOOL TOOL={params.TOOL} SKIP_Z_CORRECTION=1
    G90
    G0 X{params.X} Y{params.Y} F12000
    G0 Z5 F600
    BEACON_PROBE PROBE_METHOD=contact SAMPLES={params.SAMPLES} SAMPLES_RESULT=median SAMPLES_TOLERANCE={me.tolerance} SAMPLES_TOLERANCE_RETRIES=3
    _C3_CAL_TOOL_Z_STORE TOOL={params.TOOL}
    G91
    G0 Z5 F600
    G90

[gcode_macro _C3_CAL_TOOL_Z_STORE]
description: Inner - store the last Beacon contact result for TOOL
gcode:
    SAVE_VARIABLE VARIABLE=c3_bz_{params.TOOL|int} VALUE={"%.5f"|format(printer.beacon.last_z_result|float)}

[gcode_macro _C3_CAL_TOOL_Z_FINISH]
description: Inner - write tN_offset_z relative to T0 and park the last tool
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set n = params.N|int %}
    {% set z0 = svv.c3_bz_0|float %}
    {% set t0_off = svv.t0_offset_z|default(0.0)|float %}
    {% for i in range(n) %}
        {% set zi = svv["c3_bz_%d" % i]|float %}
        SAVE_VARIABLE VARIABLE=t{i}_offset_z VALUE={"%.3f"|format(t0_off + zi - z0)}
        RESPOND TYPE=echo MSG="T{i}: contact z {zi|round(4)}, difference from T0 {(zi - z0)|round(4)} mm, t{i}_offset_z {(t0_off + zi - z0)|round(3)}"
    {% endfor %}
    G90
    G0 Z20 F600
    PARK_TOOL
    RESPOND TYPE=echo MSG="C3_CAL_TOOL_Z done. Pick up a tool to apply the new offsets."

# ------------------------------------------------------------------ print end / cancel
[gcode_macro END_PRINT]
description: C3 print end: retract, park the tool, heaters off, exhaust after a heated chamber
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set th = printer.toolhead %}
    {% set heated = printer["heater_generic chamber_temp"].target|float > 0 %}
    {% set lift = [5.0, th.axis_maximum.z|float - th.position.z|float - 1.0]|min %}
    {% set hot = printer.extruder.temperature|float >= printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
    M400
    {% if hot %}
        M83
        G1 E-1.0 F1800
    {% endif %}
    {% if lift > 0 %}
        G91
        G0 Z{lift} F600
        G90
    {% endif %}
    {% if cv.park_tool_at_end and printer.save_variables.variables.active_tool|default(-1)|int >= 0 %}
        PARK_TOOL
    {% endif %}
    G90
    G0 X{cv.park_x} Y{cv.park_y} F{cv.travel_feed}
    _C3_END_COMMON HEATED={1 if heated else 0}
    M84

[gcode_macro PRINT_END]
description: Alias for END_PRINT
gcode:
    END_PRINT {rawparams}

[gcode_macro _C3_END_COMMON]
description: Inner - heaters and fans off, chamber ceiling cleared, exhaust run after a heated chamber
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    TURN_OFF_HEATERS
    M141 S0
    M107
    SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cap VALUE=0
    BED_MESH_CLEAR
    {% if params.HEATED|default(0)|int == 1 %}
        _C3_EXHAUST_PURGE MINUTES={cv.exhaust_after_minutes}
    {% endif %}

[gcode_macro _C3_CANCEL]
description: Inner - run by Mainsail's CANCEL_PRINT before its base cancel
gcode:
    _C3_END_COMMON HEATED={1 if printer["heater_generic chamber_temp"].target|float > 0 else 0}

[gcode_macro _CLIENT_VARIABLE]
description: Mainsail PAUSE / RESUME / CANCEL_PRINT settings for the C3
variable_use_custom_pos: True
variable_custom_park_x: 252.5
variable_custom_park_y: 470.0
variable_custom_park_dz: 5.0
variable_retract: 1.0
variable_cancel_retract: 5.0
variable_speed_retract: 35.0
variable_unretract: 1.0
variable_speed_unretract: 35.0
variable_speed_hop: 10.0
variable_speed_move: 200.0
variable_park_at_cancel: True
variable_park_at_cancel_x: None
variable_park_at_cancel_y: None
variable_use_fw_retract: False
variable_idle_timeout: 0
variable_runout_sensor: ""
variable_user_pause_macro: ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "_C3_CANCEL"
gcode:

# ------------------------------------------------------------------ wiper stations
[gcode_macro _C3_STATION]
description: Inner - station chosen by the last _C3_STATION_GO
variable_x: 0.0
gcode:

[gcode_macro _C3_STATION_GO]
description: Inner - travel to the nearer station's purge point (behind the keep-outs, then straight forward in the lane)
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set ns = namespace(sx=cv.station_x[0]|float) %}
    {% for sx in cv.station_x %}
        {% if (sx|float - th.position.x|float)|abs < (ns.sx - th.position.x|float)|abs %}
            {% set ns.sx = sx|float %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_C3_STATION VARIABLE=x VALUE={ns.sx}
    G90
    {% if th.position.y|float < cv.station_approach_y|float %}
        G0 Y{"%.3f"|format(cv.station_approach_y|float - o.y)} F{cv.travel_feed}
    {% endif %}
    G0 X{"%.3f"|format(ns.sx - o.x)} F{cv.travel_feed}
    G0 Y{"%.3f"|format(cv.station_purge_y|float - o.y)} F{cv.travel_feed}

[gcode_macro _C3_STATION_WIPE_OUT]
description: Inner - STROKES wipes across the pad from the purge point, then straight back out of the lane
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set sx = printer["gcode_macro _C3_STATION"].x|float %}
    {% set strokes = params.STROKES|default(cv.wipe_strokes)|int %}
    {% set side = cv.station_side|float %}
    {% set py = cv.station_purge_y|float - o.y %}
    {% set wy = cv.station_wipe_y|float - o.y %}
    G90
    {% for i in range(strokes) %}
        G1 X{"%.3f"|format(sx - o.x + (side if i % 2 == 0 else -side))} Y{"%.3f"|format(wy)} F{cv.wipe_feed}
        G1 X{"%.3f"|format(sx - o.x)} Y{"%.3f"|format(py)} F{cv.wipe_feed}
    {% endfor %}
    G1 Y{"%.3f"|format(wy)} F{cv.wipe_feed}
    G0 Y{"%.3f"|format(cv.station_approach_y|float - o.y)} F{cv.travel_feed}

[gcode_macro C3_WIPE]
description: Wipe the nozzle at the nearer station. Skipped below Z 12 (station sliders lifted; the prime tower covers those layers). STROKES=
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set th = printer.toolhead %}
    {% if "xyz" not in th.homed_axes|lower %}
        { action_raise_error("C3_WIPE: home XYZ first") }
    {% elif printer.save_variables.variables.active_tool|default(-1)|int < 0 %}
        RESPOND TYPE=echo MSG="C3_WIPE skipped: no tool on the head"
    {% elif th.position.z|float < cv.station_min_z|float %}
        RESPOND TYPE=echo MSG="C3_WIPE skipped: Z {th.position.z|round(2)} is below {cv.station_min_z} mm"
    {% else %}
        {% set hop = [1.0, th.axis_maximum.z|float - th.position.z|float]|min %}
        SAVE_GCODE_STATE NAME=_c3_wipe
        G91
        G0 Z{hop} F600
        _C3_STATION_GO
        _C3_STATION_WIPE_OUT STROKES={params.STROKES|default(cv.wipe_strokes)|int}
        G91
        G0 Z-{hop} F600
        RESTORE_GCODE_STATE NAME=_c3_wipe
    {% endif %}

[gcode_macro C3_PURGE]
description: Purge LENGTH mm at the nearer station at Z 30 or higher, then wipe. The head ends at the lane exit (Y 31).
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set th = printer.toolhead %}
    {% set length = params.LENGTH|default(cv.purge_length)|float %}
    {% set o = printer.gcode_move.homing_origin %}
    {% if printer.save_variables.variables.active_tool|default(-1)|int < 0 %}
        { action_raise_error("C3_PURGE: no tool on the head") }
    {% endif %}
    {% if printer.extruder.temperature|float < printer.configfile.settings.extruder.min_extrude_temp|default(170)|float %}
        { action_raise_error("C3_PURGE: nozzle is below min_extrude_temp") }
    {% endif %}
    SAVE_GCODE_STATE NAME=_c3_purge
    G90
    {% if th.position.z|float < cv.purge_z|float %}
        G0 Z{"%.3f"|format(cv.purge_z|float - o.z)} F600
    {% endif %}
    _C3_STATION_GO
    M83
    G1 E{length} F{cv.purge_feed}
    G4 P{(cv.purge_dwell|float * 1000)|int}
    _C3_STATION_WIPE_OUT
    RESTORE_GCODE_STATE NAME=_c3_purge

[gcode_macro C3_LOAD_FILAMENT]
description: Load filament into a tool at its wiper station. TOOL= and TYPE= (PLA, PETG, ABS, ASA, PA, PC, TPU) or TEMP=; MEASURE=1; KEEP_HOT=1
gcode:
    {% if 'TOOL' not in params or ('TYPE' not in params and 'TEMP' not in params) %}
        { action_raise_error("Usage: C3_LOAD_FILAMENT TOOL=<n> TYPE=<material> or TEMP=<C>") }
    {% endif %}
    {% set t = params.TOOL|int %}
    CHANGE_TOOL TOOL={t}
    _C3_LOAD_AT_STATION TOOL={t} TYPE={params.TYPE|default("NONE")} TEMP={params.TEMP|default(-1)} MEASURE={params.MEASURE|default(0)|int} KEEP_HOT={params.KEEP_HOT|default(0)|int}

[gcode_macro _C3_LOAD_AT_STATION]
description: Inner - raise, go to the station, run INDX LOAD_FILAMENT there, wipe on the way out
gcode:
    {% set cv = printer["gcode_macro _C3_VARS"] %}
    {% set th = printer.toolhead %}
    {% set o = printer.gcode_move.homing_origin %}
    {% set type = params.TYPE|default("NONE")|string|upper %}
    {% set temp = params.TEMP|default(-1)|float %}
    SAVE_GCODE_STATE NAME=_c3_load
    G90
    {% if th.position.z|float < cv.purge_z|float %}
        G0 Z{"%.3f"|format(cv.purge_z|float - o.z)} F600
    {% endif %}
    _C3_STATION_GO
    LOAD_FILAMENT TOOL={params.TOOL|int}{(" TYPE=" ~ type) if type != "NONE" else ""}{(" TEMP=%.0f" % temp) if temp > 0 else ""} MEASURE={params.MEASURE|default(0)|int}
    G4 P{(cv.purge_dwell|float * 1000)|int}
    _C3_STATION_WIPE_OUT
    {% if params.KEEP_HOT|default(0)|int == 0 %}
        M104 S0
    {% endif %}
    RESTORE_GCODE_STATE NAME=_c3_load

# ------------------------------------------------------------------ fans (slicer M106 P2 / P3 kept from stock)
[gcode_macro M106]
description: Part fan, or P2 chamber circulation / P3 exhaust (ignored while the chamber HVAC owns them)
rename_existing: M99106
gcode:
    {% set p = params.P|default(0)|int %}
    {% set s = params.S|default(255)|float %}
    {% set speed = ([[s, 0]|max, 255]|min) / 255 %}
    {% set hvac = printer["heater_generic chamber_temp"].target|float > 0 or printer["gcode_macro _C3_CHAMBER_STATE"].cap|float > 0 %}
    {% if p == 2 or p == 3 %}
        {% if hvac %}
            RESPOND TYPE=echo MSG="M106 P{p} ignored: the chamber control owns this fan"
        {% elif p == 2 %}
            SET_FAN_SPEED FAN=chamber_circulation SPEED={speed}
        {% else %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED={speed}
        {% endif %}
    {% else %}
        M99106 S{s}
    {% endif %}

[gcode_macro M107]
description: Part fan off, or P2 / P3 off when the chamber HVAC is idle
rename_existing: M99107
gcode:
    {% set p = params.P|default(0)|int %}
    {% set hvac = printer["heater_generic chamber_temp"].target|float > 0 or printer["gcode_macro _C3_CHAMBER_STATE"].cap|float > 0 %}
    {% if p == 2 or p == 3 %}
        {% if not hvac %}
            SET_FAN_SPEED FAN={'chamber_circulation' if p == 2 else 'exhaust_fan'} SPEED=0
        {% endif %}
    {% else %}
        M99107
    {% endif %}

# ------------------------------------------------------------------ light, idle
[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=chamber_light VALUE=1

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=chamber_light VALUE=0

[gcode_macro LIGHTS_TOGGLE]
gcode:
    SET_PIN PIN=chamber_light VALUE={0 if printer["output_pin chamber_light"].value|float > 0 else 1}

[gcode_macro _C3_IDLE_TIMEOUT]
description: Idle timeout: heaters, chamber, fans and light off, motors off
gcode:
    TURN_OFF_HEATERS
    M141 S0
    M107
    SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cap VALUE=0
    LIGHTS_OFF
    M84
