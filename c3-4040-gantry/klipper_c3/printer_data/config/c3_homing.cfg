#####################################################################
#  C3 sensorless X/Y homing on mainline Klipper.
#
#  Klipper allows one [homing_override]; Bondtech says to merge your own
#  sensorless handling into theirs. This file is included after
#  indx/homing.cfg and redefines [homing_override] with Bondtech's gcode
#  verbatim (macros/homing.cfg, commit 05018b2) except for two lines:
#      G28 Y  ->  _C3_HOME_AXIS AXIS=Y
#      G28 X  ->  _C3_HOME_AXIS AXIS=X
#  tools/check_config.py verifies that this is still the only difference.
#  If Bondtech updates homing.cfg, regenerate this override from it.
#####################################################################

[homing_override]
axes: xyz
gcode:
    {% set home_all = not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_x = home_all or 'X' in params %}
    {% set home_z = home_all or 'Z' in params %}
    # X requires Y: G28 X with Y unknown homes Y first
    {% set home_y = home_all or 'Y' in params
        or (home_x and "y" not in printer.toolhead.homed_axes) %}
    {% set tp = printer["gcode_macro TOOL_POSITIONS"] %}
    _INDX_CHECK_CLEARANCE
    # A failed pickup may have left a tool half seated on the head: no Z home
    # until the head has been checked by hand
    {% if home_z %}
        _INDX_CHECK_SUSPECT
    {% endif %}
    # In the first seconds after a restart INIT_STATE has not built the tools
    # list yet; the T0 fetch below needs it
    {% if tp.tools|length == 0 %}
        _INDX_BUILD_TOOLS
    {% endif %}
    # With Z unhomed a loaded bed mesh has no valid reference, and it still
    # adds its Z correction to the X/Y moves below, which Klipper refuses
    # ("Must home axis first", e.g. after idle_timeout's M84). Drop it; a
    # G28 with Z homed keeps it.
    {% if "z" not in printer.toolhead.homed_axes and "bed_mesh" in printer %}
        {% set mm = printer.bed_mesh.mesh_matrix|default([[]]) %}
        {% if mm|length and mm[0]|length %}
            RESPOND MSG="INDX: bed mesh cleared, Z is not homed"
        {% endif %}
        BED_MESH_CLEAR
    {% endif %}
    # Z homes on T0: with any other tool (or none) on the head G28 fetches T0
    # from its dock, which needs calibrated dock positions
    {% if home_z and printer.save_variables.variables.active_tool|default(-1)|int != 0 %}
        _INDX_CHECK_DOCKS FOR=home
    {% endif %}

    # 1. Clear Z before any axis home
    _INDX_SAFE_Z_HOP

    # 2. Home Y first (X-first can sweep into tools)
    {% if home_y %}
        _C3_HOME_AXIS AXIS=Y
    {% endif %}

    # 3. Stay off the dock line before X. Homing X sweeps the head across
    # every dock position, so it has to happen at a Y that clears the tools.
    # Where the head is by now depends on how Y got homed:
    #   Y just homed - it is at its endstop. This template renders before
    #     G28 Y runs, so printer.toolhead.position still reports the pre-home
    #     value; position_endstop from the config is where Y actually lands.
    #   Y already homed and untouched - the live position is correct.
    # Either way, move only when that Y is on the dock side of clearance_y.
    # A machine whose Y endstop is opposite the docks is already clear and
    # should home X where it stands, which is also further from the tools
    # than clearance_y is.
    {% if home_x %}
        {% set clear_y = tp.clearance_y|float %}
        {% set ns = namespace(cur_y=none) %}
        {% if home_y %}
            {% set ycfg = printer.configfile.settings.stepper_y %}
            {% if "position_endstop" in ycfg %}
                {% set ns.cur_y = ycfg.position_endstop|float %}
            {% endif %}
        {% else %}
            {% set ns.cur_y = printer.toolhead.position.y|float %}
        {% endif %}
        # An unknown Y cannot be proven clear, so move rather than assume.
        {% if ns.cur_y is none or (ns.cur_y - clear_y) * (tp.dock_dir|float) > 0 %}
            G90
            G0 Y{"%.3f"|format(clear_y)} F{tp.home_travel_feedrate|default(3000)|int}
        {% endif %}
        _C3_HOME_AXIS AXIS=X
    {% endif %}

    # 4. Z needs a seated tool (load cell = nozzle probe)
    {% if home_z %}
        _INDX_HOME_Z
    {% endif %}

[gcode_macro _C3_HOME_AXIS]
description: Inner - sensorless home of X (to X min) or Y (to the rear), back off, and let the stall flags clear
variable_backoff: 10.0
variable_settle_ms: 2000
gcode:
    {% set a = params.AXIS|upper %}
    {% set me = printer["gcode_macro _C3_HOME_AXIS"] %}
    {% if a not in ["X", "Y"] %}
        { action_raise_error("_C3_HOME_AXIS: AXIS must be X or Y") }
    {% endif %}
    # X homes to its minimum, Y to its maximum (the rear, away from the docks)
    {% set away = me.backoff|float if a == "X" else -(me.backoff|float) %}
    G28 {a}
    G91
    G0 {a}{"%.2f"|format(away)} F3000
    G90
    # Both carriages' drivers see the impact; give StallGuard time to clear
    # before the next axis homes (Klipper TMC_Drivers.md, CoreXY tips)
    M400
    G4 P{me.settle_ms|int}
    M400
