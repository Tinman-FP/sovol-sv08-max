# Add these sections to ~/printer_data/config/moonraker.conf on the C3 host.
# They are additions, not a whole moonraker.conf.

# Beacon host module (install with Beacon's install.sh, which also links beacon.py)
[update_manager beacon]
type: git_repo
channel: dev
path: ~/beacon_klipper
origin: https://github.com/beacon3d/beacon_klipper.git
env: ~/klippy-env/bin/python
requirements: requirements.txt
install_script: install.sh
is_system_service: False
managed_services: klipper
info_tags:
    desc=Beacon Surface Scanner

# KlipperScreen (KIAUH installs it and usually adds this section itself)
[update_manager KlipperScreen]
type: git_repo
path: ~/KlipperScreen
origin: https://github.com/KlipperScreen/KlipperScreen.git
virtualenv: ~/.KlipperScreen-env
requirements: scripts/KlipperScreen-requirements.txt
system_dependencies: scripts/system-dependencies.json
managed_services: KlipperScreen

# Bondtech's INDX host module for mainline Klipper (linked into klippy/extras by install.sh)
[update_manager indx_klipper]
type: git_repo
path: ~/indx_klipper
origin: https://github.com/BondtechAB/indx_klipper.git
is_system_service: False
managed_services: klipper
