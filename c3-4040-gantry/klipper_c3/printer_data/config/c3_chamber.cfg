#####################################################################
#  Chamber: Sovol's chamber heating module, kept with its own controller,
#  plus the bidirectional HVAC control already qualified on the stock
#  machine (staging/2026-10-14-chamber-hvac-exhaust-control and
#  2026-10-14-chamber-pid-smooth-hvac-bedfirst), ported to the new fan
#  names.
#
#  Why the heater stays on Sovol's controller (read from the live SV08
#  Max over Moonraker, 2026-10-30, read-only):
#    - the module is mains powered with its own power cable and rear
#      switch (Sovol sells US / EU / AU / UK plug variants), and its
#      controller (hot_mcu: STM32F103, CAN 1000000 bit/s) switches the
#      heater inside the module on its PA0;
#    - so there is no low-voltage SSR input to move to the Kraken without
#      opening a mains module. Instead the controller joins the Kraken's
#      CAN bus (the Kraken runs as a USB-to-CAN bridge, printer.cfg).
#  Everything below matches the live chamber_hot.cfg: Sovol's own
#  thermistor curve, the 20 k pull-up on that board, and your PID tune.
#  The live machine has no room thermistor, so none is configured: an
#  unconnected thermistor input would shut Klipper down.
#####################################################################

[mcu hot_mcu]
# The same board as on the stock machine: copy the canbus_uuid from the
# [mcu hot_mcu] section of the Sovol's current chamber_hot.cfg.
canbus_uuid: REPLACE_ME

[thermistor chamber_thermistor]
# Sovol's curve for the module's sensor (live chamber_hot.cfg)
temperature1: 25
resistance1: 103000
temperature2: 50
resistance2: 36500
temperature3: 80
resistance3: 24000

[heater_generic chamber_temp]
# Name kept from stock so M141/M191, Mainsail and the slicer still match
gcode_id: C
heater_pin: hot_mcu:PA0
max_power: 1.0
sensor_type: chamber_thermistor
sensor_pin: hot_mcu:PA5
pullup_resistor: 20000
control: pid
# Your tune on this module (45 C chamber, 85 C bed, 2026-10-14). The heater
# and sensor are unchanged, so it carries over; re-check once the C3
# gantry and top hat are on (PID_CALIBRATE HEATER=chamber_temp TARGET=45).
pid_kp: 49.649
pid_ki: 0.326
pid_kd: 1887.748
min_temp: 0
max_temp: 65

[verify_heater chamber_temp]
max_error: 120
check_gain_time: 1200
hysteresis: 30
heating_gain: 1

# ------------------------------------------------------------------ M141 / M191
[gcode_macro M141]
description: Set the chamber target (0-55 C) without waiting
gcode:
    {% set s = params.S|default(0)|float %}
    {% set cap = printer["gcode_macro _C3_CHAMBER_STATE"].max_target|float %}
    {% if s < 0 or s > cap %}
        { action_raise_error("Chamber target must be between 0 and %.0f C" % cap) }
    {% endif %}
    SET_HEATER_TEMPERATURE HEATER=chamber_temp TARGET={s}
    {% if s <= 0 %}
        SET_GCODE_VARIABLE MACRO=M191 VARIABLE=warmup_active VALUE=False
    {% endif %}

[gcode_macro M191]
description: Set the chamber target and wait from either side (heat up, or exhaust down)
variable_warmup_active: False
gcode:
    {% set s = params.S|default(0)|float %}
    {% set cap = printer["gcode_macro _C3_CHAMBER_STATE"].max_target|float %}
    {% set temperature = printer["heater_generic chamber_temp"].temperature|float %}
    {% set overshoot = temperature - s %}
    {% if s < 0 or s > cap %}
        { action_raise_error("Chamber target must be between 0 and %.0f C" % cap) }
    {% elif s == 0 %}
        SET_GCODE_VARIABLE MACRO=M191 VARIABLE=warmup_active VALUE=False
        SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cooling_active VALUE=False
        SET_HEATER_TEMPERATURE HEATER=chamber_temp TARGET=0
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        UPDATE_DELAYED_GCODE ID=_C3_CIRCULATION_OFF DURATION=30
        M117 Chamber conditioning cancelled
    {% else %}
        SET_GCODE_VARIABLE MACRO=M191 VARIABLE=warmup_active VALUE=True
        UPDATE_DELAYED_GCODE ID=_C3_CIRCULATION_OFF DURATION=0
        SET_FAN_SPEED FAN=chamber_circulation SPEED=1.0
        # A blocking wait stops the delayed control loop, so a hot chamber
        # is exhausted down here directly (stock-machine finding, 2026-10-14).
        {% if overshoot > 0.8 %}
            SET_HEATER_TEMPERATURE HEATER=chamber_temp TARGET=0
            {% if overshoot >= 3.0 %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=0.40
            {% elif overshoot >= 1.5 %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=0.25
            {% else %}
                SET_FAN_SPEED FAN=exhaust_fan SPEED=0.15
            {% endif %}
            TEMPERATURE_WAIT SENSOR="heater_generic chamber_temp" MAXIMUM={s + 0.55}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% else %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
        SET_HEATER_TEMPERATURE HEATER=chamber_temp TARGET={s}
        {% if temperature < s - 0.25 %}
            TEMPERATURE_WAIT SENSOR="heater_generic chamber_temp" MINIMUM={s - 0.25}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=M191 VARIABLE=warmup_active VALUE=False
        SET_FAN_SPEED FAN=chamber_circulation SPEED=0.8
        M117 Chamber at target temperature
    {% endif %}

# ------------------------------------------------------------------ HVAC control loop
[gcode_macro _C3_CHAMBER_STATE]
description: Chamber HVAC settings and state
# Bondtech rates the Smart Head for 60 C ambient, and the head works in the
# hottest air near the top of the chamber, so targets stop at 55 C.
variable_max_target: 55.0
variable_last_target: 0.0
variable_cooling_active: False
variable_cooling_start_delta: 0.80
variable_cooling_stop_delta: 0.55
variable_exhaust_min_speed: 0.15
variable_exhaust_max_speed: 0.50
variable_exhaust_full_delta: 3.0
# Upper limit for low-temperature filament (no chamber heat): START_PRINT
# sets it from _C3_VARS chamber_cap; 0 = no limit
variable_cap: 0.0
gcode:

[gcode_macro _C3_HVAC_STEP]
description: One chamber HVAC control step. The delayed loop runs it every second; long START_PRINT waits run it themselves, because delayed G-code cannot run while a macro holds the G-code queue.
gcode:
    {% set chamber = printer["heater_generic chamber_temp"] %}
    {% set target = chamber.target|float %}
    {% set temperature = chamber.temperature|float %}
    {% set heater_power = chamber.power|float %}
    {% set state = printer["gcode_macro _C3_CHAMBER_STATE"] %}
    {% set last_target = state.last_target|float %}
    {% set cooling_active = state.cooling_active %}
    {% set cooling_start = state.cooling_start_delta|float %}
    {% set cooling_stop = state.cooling_stop_delta|float %}
    {% set exhaust_min = state.exhaust_min_speed|float %}
    {% set exhaust_max = state.exhaust_max_speed|float %}
    {% set exhaust_full = state.exhaust_full_delta|float %}
    {% set cap = state.cap|float %}
    {% set warmup_active = printer["gcode_macro M191"].warmup_active %}
    {% set circ_speed = printer["fan_generic chamber_circulation"].speed|float %}
    {% set exhaust_speed_now = printer["fan_generic exhaust_fan"].speed|float %}
    # With a target, control against the target; without one, against the
    # low-temperature cap (PLA/PETG/TPU), with the same band and hysteresis.
    {% set setpoint = target if target > 0 else cap %}
    {% set overshoot = temperature - setpoint %}

    {% if target > 0 %}
        UPDATE_DELAYED_GCODE ID=_C3_CIRCULATION_OFF DURATION=0
        {% if warmup_active and circ_speed < 0.99 %}
            SET_FAN_SPEED FAN=chamber_circulation SPEED=1.0
        {% elif not warmup_active and (circ_speed < 0.79 or circ_speed > 0.81) %}
            SET_FAN_SPEED FAN=chamber_circulation SPEED=0.8
        {% endif %}
    {% elif last_target > 0 %}
        SET_GCODE_VARIABLE MACRO=M191 VARIABLE=warmup_active VALUE=False
        UPDATE_DELAYED_GCODE ID=_C3_CIRCULATION_OFF DURATION=30
    {% endif %}

    {% if setpoint > 0 %}
        {% if cooling_active %}
            {% if overshoot <= cooling_stop or heater_power > 0.001 %}
                {% if exhaust_speed_now > 0.001 %}
                    SET_FAN_SPEED FAN=exhaust_fan SPEED=0
                {% endif %}
                SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cooling_active VALUE=False
            {% else %}
                {% if overshoot >= exhaust_full %}
                    {% set want = exhaust_max %}
                {% elif overshoot > cooling_start %}
                    {% set want = exhaust_min + ((overshoot - cooling_start) * (exhaust_max - exhaust_min) / (exhaust_full - cooling_start)) %}
                {% else %}
                    {% set want = exhaust_min %}
                {% endif %}
                {% if exhaust_speed_now < want - 0.01 or exhaust_speed_now > want + 0.01 %}
                    SET_FAN_SPEED FAN=exhaust_fan SPEED={"%.3f"|format(want)}
                {% endif %}
            {% endif %}
        {% elif overshoot >= cooling_start and heater_power <= 0.001 %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED={exhaust_min}
            SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cooling_active VALUE=True
        {% elif exhaust_speed_now > 0.001 and not printer["gcode_macro _C3_EXHAUST_PURGE"].active %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
    {% elif cooling_active %}
        SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=cooling_active VALUE=False
        {% if not printer["gcode_macro _C3_EXHAUST_PURGE"].active %}
            SET_FAN_SPEED FAN=exhaust_fan SPEED=0
        {% endif %}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_C3_CHAMBER_STATE VARIABLE=last_target VALUE={target}

[delayed_gcode _C3_HVAC_LOOP]
initial_duration: 3
gcode:
    _C3_HVAC_STEP
    UPDATE_DELAYED_GCODE ID=_C3_HVAC_LOOP DURATION=1

[delayed_gcode _C3_CIRCULATION_OFF]
gcode:
    {% if printer["heater_generic chamber_temp"].target|float <= 0 %}
        SET_FAN_SPEED FAN=chamber_circulation SPEED=0
    {% endif %}

[gcode_macro _C3_EXHAUST_PURGE]
description: After a heated-chamber print, run the exhaust at full speed for MINUTES (fumes out before the door opens)
variable_active: False
gcode:
    {% set minutes = params.MINUTES|default(5)|float %}
    {% if minutes > 0 %}
        SET_GCODE_VARIABLE MACRO=_C3_EXHAUST_PURGE VARIABLE=active VALUE=True
        SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
        UPDATE_DELAYED_GCODE ID=_C3_EXHAUST_PURGE_END DURATION={(minutes * 60)|int}
    {% endif %}

[delayed_gcode _C3_EXHAUST_PURGE_END]
gcode:
    SET_GCODE_VARIABLE MACRO=_C3_EXHAUST_PURGE VARIABLE=active VALUE=False
    {% if printer["heater_generic chamber_temp"].target|float <= 0 %}
        SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    {% endif %}
